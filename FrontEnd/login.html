  <body class="auth-page d-flex flex-column align-items-center justify-content-center min-vh-100 p-3">
    <div class="auth-top-bar mb-4">
      <a href="index.html" class="auth-back-btn">
        <i class="fas fa-arrow-left me-2"></i>
        <span>Volver a Inicio</span>
      </a>
    </div>

    <div class="card p-4 p-md-5 auth-card w-100" style="max-width: 440px">
      <div class="text-center mb-4">
        <div class="auth-brand-symbol mb-3">
          <img src="assets/img/icons/icon-192x192.png" alt="SmartBus" width="48" height="48" class="rounded-3 shadow-sm">
        </div>
        <h2 class="auth-title">Bienvenido de Vuelta</h2>
        <p class="auth-subtitle">
          Ingresa al sistema de movilidad <span class="text-primary fw-semibold">SmartBus</span>
        </p>
      </div>

      <!-- Inicio de Sesión Rápido y Seguro con Google -->
      <div class="mb-3 d-flex flex-column align-items-center w-100">
        <div class="google-btn-wrapper">
          <div id="g_id_onload"
               data-client_id="935209953046-9uked6lm4ob8bkk6ek2653bj14a5ss4k.apps.googleusercontent.com"
               data-context="signin"
               data-ux_mode="popup"
               data-callback="handleGoogleCredentialResponse"
               data-auto_prompt="false">
          </div>
          <div class="g_id_signin"
               data-type="standard"
               data-shape="pill"
               data-theme="filled_black"
               data-text="continue_with"
               data-size="large"
               data-logo_alignment="left"
               data-width="320">
          </div>
          <div id="google-btn-container"></div>
        </div>
      </div>

      <div class="d-flex align-items-center my-4">
        <div class="flex-grow-1 border-top border-secondary opacity-25"></div>
        <span class="px-3 text-muted small fw-semibold text-uppercase" style="font-size: 0.72rem; letter-spacing: 0.8px;">
          O con contraseña
        </span>
        <div class="flex-grow-1 border-top border-secondary opacity-25"></div>
      </div>

      <form id="login-form">
        <div class="mb-3">
          <label for="correo" class="form-label auth-label">Correo Electrónico</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
            <input
              type="email"
              class="form-control"
              id="correo"
              name="correo"
              placeholder="nombre@ejemplo.com"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <div class="mb-3">
          <label for="contrasena" class="form-label auth-label">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input
              type="password"
              class="form-control border-end-0"
              id="contrasena"
              name="contrasena"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <button class="input-group-text border-start-0 text-muted" type="button" id="togglePassword" aria-label="Mostrar u ocultar contraseña">
              <i class="fas fa-eye-slash" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <div id="auth-message" class="auth-message mb-3" role="alert"></div>

        <button
          type="submit"
          class="btn btn-primary w-100 py-2 fw-bold mb-3 auth-submit-btn"
        >
          <i class="fas fa-sign-in-alt me-2"></i> Iniciar Sesión
        </button>
      </form>

      <p class="text-center mt-3 auth-footer-text mb-0">
        ¿Aún no tienes cuenta?
        <a href="registro.html" class="auth-link fw-bold">Crear Cuenta</a>
      </p>
    </div>
