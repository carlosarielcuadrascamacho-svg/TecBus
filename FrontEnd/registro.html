  <body class="auth-page d-flex flex-column align-items-center justify-content-center min-vh-100 p-3">
    <div class="auth-top-bar mb-4">
      <a href="index.html" class="auth-back-btn">
        <i class="fas fa-arrow-left me-2"></i>
        <span>Volver a Inicio</span>
      </a>
    </div>

    <div class="card p-4 p-md-5 auth-card w-100" style="max-width: 440px">
      <div class="text-center mb-4">
        <div class="auth-brand-symbol mb-3">
          <img src="assets/img/icons/icon-192x192.png" alt="SmartBus" width="48" height="48" class="rounded-3 shadow-sm">
        </div>
        <h2 class="auth-title">Crea tu Cuenta</h2>
        <p class="auth-subtitle">
          Únete a la red inteligente de transporte <span class="text-primary fw-semibold">SmartBus</span>
        </p>
      </div>

      <!-- Registro Rápido con Google -->
      <div class="mb-3 d-flex flex-column align-items-center">
        <div id="google-btn-container" class="w-100 d-flex justify-content-center"></div>
      </div>

      <div class="position-relative text-center my-4">
        <hr class="border-secondary opacity-25 m-0" />
        <span class="position-absolute top-50 start-50 translate-middle px-3 bg-dark text-muted small fw-semibold text-uppercase" style="letter-spacing: 0.5px;">
          O registro manual
        </span>
      </div>

      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <span class="auth-step-text">Información de Acceso</span>
          <span class="auth-step-badge">Paso 1 de 2</span>
        </div>
        <div class="progress auth-progress-bar">
          <div
            class="progress-bar"
            role="progressbar"
            style="width: 50%"
            aria-valuenow="50"
            aria-valuemin="0"
            aria-valuemax="100"
          ></div>
        </div>
      </div>

      <form id="registro-form">
        <div class="mb-3">
          <label for="nombre" class="form-label auth-label">Nombre Completo</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-user" aria-hidden="true"></i></span>
            <input
              type="text"
              class="form-control"
              id="nombre"
              name="nombre"
              placeholder="Ej. Juan Pérez García"
              autocomplete="name"
              required
            />
          </div>
        </div>

        <div class="mb-3">
          <label for="correo" class="form-label auth-label">Correo Electrónico</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
            <input
              type="email"
              class="form-control"
              id="correo"
              name="correo"
              placeholder="usuario@ejemplo.com"
              autocomplete="email"
              required
            />
          </div>
          <div class="form-text auth-hint mt-1">
            Utiliza una dirección de correo activa.
          </div>
        </div>

        <div class="mb-4">
          <label for="contrasena" class="form-label auth-label">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input
              type="password"
              class="form-control border-end-0"
              id="contrasena"
              name="contrasena"
              placeholder="Mínimo 8 caracteres"
              autocomplete="new-password"
              required
            />
            <button class="input-group-text border-start-0 text-muted" type="button" id="togglePassword" aria-label="Mostrar u ocultar contraseña">
              <i class="fas fa-eye-slash" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <div id="auth-message" class="auth-message mb-3" role="alert"></div>

        <button
          type="submit"
          class="btn btn-primary w-100 py-2 fw-bold mb-3 auth-submit-btn"
        >
          <i class="fas fa-check-circle me-2"></i> Continuar Registro
        </button>
      </form>

      <p class="text-center mt-3 auth-footer-text mb-0">
        ¿Ya tienes cuenta registrada?
        <a href="login.html" class="auth-link fw-bold">Iniciar Sesión</a>
      </p>
    </div>
